	(function (H)
	{
		function collide(a, b)
		{
			return !(b.x > a.x + a.width ||
			         b.x + b.width < a.x ||
			         b.y > a.y + a.height ||
			         b.y + b.height < a.y);
		}

		H.wrap(H.seriesTypes.flags.prototype, 'drawPoints', function (p)
		{
			var series = this;
			var chart = series.chart;
			var overlap = true;
			var counter = 0;
			var index;
			var offset = series.options.stackDistance;
			var currentBBox;
			var compareBBox;
			var compareSeries;

			p.call(this);

			while (overlap && counter < 100)
			{
				overlap = false;
				H.each(series.points, function (currentPoint)
				{
					if (!currentPoint.graphic) return;

					currentBBox = {
						x: currentPoint.graphic.translateX,
						y: currentPoint.graphic.translateY,
						width: currentPoint.graphic.width,
						height: currentPoint.graphic.height,
					};

					for (index = 0; series.index - index >= 0; index++)
					{
						compareSeries = chart.series[index];
						if (compareSeries.options.type !== "flags") continue;

						H.each(compareSeries.points, function (comparePoint)
						{
							if (compareSeries === series &&
							    comparePoint.index >= currentPoint.index)
								return;
							if (!comparePoint.graphic) return;

							compareBBox = {
								x: comparePoint.graphic.translateX,
								y: comparePoint.graphic.translateY,
								width: comparePoint.graphic.width,
								height: comparePoint.graphic.height,
							};

							if (!collide(currentBBox, compareBBox)) return;

							overlap = true;
							currentPoint.graphic.attr({
								y: currentPoint.graphic.attr("y") - offset,
								anchorY: currentPoint.plotY,
							});
							currentPoint.tooltipPos[1] -= offset;
						});
					}
				});
				counter++;
			}
		});
	})(Highcharts)

	var colors = Highcharts.getOptions().colors;
	function mTime (year, month)
	{
		var date = new Date(year, month - 1, 1, 0, 0, 0);
		var offset = 60000 * date.getTimezoneOffset();
		return date.getTime() - offset;
	}
	function note (idx, y, year, month, title)
	{
		return { x: mTime(year, month), y: y, title: title,
		         color: colors[idx], fillColor: colors[idx] };
	}
